# Site estático: sem build; publica só a pasta do app.
# Os cabeçalhos de segurança (CSP etc.) ficam em guia-reino/_headers (vale também no Cloudflare Pages).
[build]
  publish = "guia-reino"
  command = ""

# Funções do servidor (integrações de chat): endpoint /api/chat, segredos nas variáveis de ambiente.
# O núcleo fica em integracoes/ (independente do provedor); netlify/functions/ só adapta.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
