      <div class="search-wrap">
        <input id="search" type="search" placeholder="Buscar atividade, estrutura, regra…  ( / )" autocomplete="off" aria-label="Busca global">
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <div class="topbar-actions">
        <button id="btn-theme" class="btn btn-ghost btn-icon" title="Alternar tema claro/escuro" aria-label="Alternar tema">◐</button>

    <nav class="tabs" id="tabs">

      <div class="modal-head">
        <button class="btn btn-ghost btn-icon" id="modal-back" title="Voltar" aria-label="Voltar" hidden>←</button>
        <div class="modal-titles">
          <div class="modal-kind" id="modal-kind"></div>
          <h2 id="modal-title"></h2>
          <div class="modal-sub" id="modal-sub"></div>
        </div>
        <button class="btn btn-ghost btn-icon" data-close title="Fechar (Esc)" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <footer class="footer">
    Referência não oficial para uso da mesa, compilada do <em>Kingmaker Player's Guide</em> (Paizo). Resumos em português; texto completo das regras no original em inglês.
